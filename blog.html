---
layout: default
title: Blog
permalink: /blog/
---

<div class="blog-index">

<div align="center" style="font-size:1.1em">Blog</div>

<br>

{% for post in site.posts %}
  <div class="blog-entry">
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>

    <span class="blog-date">{{ post.date | date: "%Y.%m.%d" }}</span>
  </div>
  <br>
{% endfor %}

</div>
